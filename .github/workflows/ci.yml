# CI caller: verification (Ubuntu + Windows) and release are delegated to the shared templates workflows.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to verify (checked out as refs/pull/<n>/head)
        required: false
        default: ""
        type: string

# Tag and branch runs share the SHA-based group: a release tag cancels the CI
# run for the same commit, while CI never cancels an in-progress release.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  verify:
    name: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: CaffeinatedPinguin/templates/.github/workflows/node-ci.yml@880535ab7c051ec7a72651057a78628b727ab285
    with:
      runs-on: ${{ matrix.os }}
      # A manual run can verify an untrusted PR head without a pull_request trigger.
      ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || '' }}
      scripts: lint typecheck test build smoke
      node-version-file: .nvmrc
      # ravi has no Docker image, so the dist artifact is not uploaded.
      artifact-name: ""
      # Only the Ubuntu variant contributes the three release files.
      assets-name: ${{ matrix.os == 'ubuntu-latest' && 'ravi' || '' }}
      assets-path: |
        dist/ravi.mjs
        dist/ravi
        dist/ravi.cmd
      check-release-tag: true

  release:
    name: release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: CaffeinatedPinguin/templates/.github/workflows/release.yml@880535ab7c051ec7a72651057a78628b727ab285
    with:
      title-prefix: "ravi "
      assets-artifact: ravi
      assets-glob: ravi.mjs ravi ravi.cmd
