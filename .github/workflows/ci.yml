# CI caller: verification (Ubuntu + Windows) and release are delegated to the shared templates workflows.
name: ci

# Pull requests are "Collaborators only"; PR runs never receive repository secrets, and the
# release job only runs for tags.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to verify (checked out as refs/pull/<n>/head)
        required: false
        default: ""
        type: string

# Tag and branch runs share the SHA-based group: a release tag cancels the CI
# run for the same commit, while CI never cancels an in-progress release.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  verify:
    name: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: CaffeinatedPinguin/templates/.github/workflows/node-ci.yml@5491a12df1b2726588c95517f6790aeb7e332b63
    with:
      runs-on: ${{ matrix.os }}
      # A manual run can verify an untrusted PR head without a pull_request trigger.
      ref: ${{ github.event.inputs.pr && format('refs/pull/{0}/head', github.event.inputs.pr) || '' }}
      scripts: lint typecheck test build smoke
      node-version-file: .nvmrc
      # ravi has no Docker image, so the dist artifact is not uploaded.
      artifact-name: ""
      # Only the Ubuntu variant contributes the release files: the program and one installer per OS.
      assets-name: ${{ matrix.os == 'ubuntu-latest' && 'ravi' || '' }}
      assets-path: |
        dist/ravi.mjs
        dist/install-windows.ps1
        dist/install-macos.sh
        dist/install-linux.sh
      check-release-tag: true

  release:
    name: release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: CaffeinatedPinguin/templates/.github/workflows/release.yml@5491a12df1b2726588c95517f6790aeb7e332b63
    with:
      title-prefix: "ravi "
      assets-artifact: ravi
      assets-glob: ravi.mjs install-windows.ps1 install-macos.sh install-linux.sh

  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    permissions: {}
    uses: CaffeinatedPinguin/templates/.github/workflows/conventions.yml@5491a12df1b2726588c95517f6790aeb7e332b63

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: CaffeinatedPinguin/templates/.github/workflows/dependency-review.yml@5491a12df1b2726588c95517f6790aeb7e332b63
    with:
      fail-on-severity: high

  # The baseline required check. It never fails the run itself for a skipped
  # job, but fails when any needed job failed or was cancelled.
  ci-required:
    name: ci-required
    if: always()
    needs: [conventions, dependency-review, verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [[ "$r" == success || "$r" == skipped ]] || { echo "::error::job result: $r"; exit 1; }
          done
